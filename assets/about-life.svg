<text x="64" y="84" font-family="'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#247bff">// ABOUT</text>
<text x="64" y="140" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="52" fill="#eef1f8">WHAT I BRING TO THE TABLE.</text>
<g class="au" style="animation-delay:0.20s"><text x="64" y="206" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="34" fill="#247bff">01</text><text x="116" y="206" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="30" fill="#eef1f8">WEB APPS</text><text x="116" y="228" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8a94ad">Django, React &amp; Node.js products</text><line x1="64" y1="244" x2="470" y2="244" stroke="#1b2748"/></g><g class="au" style="animation-delay:0.35s"><text x="64" y="272" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="34" fill="#247bff">02</text><text x="116" y="272" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="30" fill="#eef1f8">MOBILE</text><text x="116" y="294" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8a94ad">Cross-platform apps with Flutter</text><line x1="64" y1="310" x2="470" y2="310" stroke="#1b2748"/></g><g class="au" style="animation-delay:0.50s"><text x="64" y="338" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="34" fill="#247bff">03</text><text x="116" y="338" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="30" fill="#eef1f8">CLOUD</text><text x="116" y="360" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8a94ad">AWS &amp; cPanel deployment</text><line x1="64" y1="376" x2="470" y2="376" stroke="#1b2748"/></g><g class="au" style="animation-delay:0.65s"><text x="64" y="404" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="34" fill="#247bff">04</text><text x="116" y="404" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="30" fill="#eef1f8">SECURITY</text><text x="116" y="426" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8a94ad">Secure-by-design thinking</text><line x1="64" y1="442" x2="470" y2="442" stroke="#1b2748"/></g>
<rect x="520" y="56" width="400" height="374" rx="28" fill="#0d1530" fill-opacity=".7" stroke="url(#ag)" stroke-width="1.5"/>
<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3033;0.3333;1.0000" dur="12s" repeatCount="indefinite"/><text x="556" y="118" font-family="'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#8a94ad">01 / 03</text><text x="556" y="236" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="104" fill="url(#ag)">BUILD</text><text x="556" y="300" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#eef1f8">Dynamic web apps that</text><text x="556" y="326" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#eef1f8">solve real problems.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3633;0.6367;0.6667;1.0000" dur="12s" repeatCount="indefinite"/><text x="556" y="118" font-family="'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#8a94ad">02 / 03</text><text x="556" y="236" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="104" fill="url(#ag)">SECURE</text><text x="556" y="300" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#eef1f8">Cybersecurity thinking in</text><text x="556" y="326" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#eef1f8">every layer.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6667;0.6967;0.9700;1.0000" dur="12s" repeatCount="indefinite"/><text x="556" y="118" font-family="'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#8a94ad">03 / 03</text><text x="556" y="236" font-family="'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif" font-size="104" fill="url(#ag)">SHIP</text><text x="556" y="300" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#eef1f8">From idea to live</text><text x="556" y="326" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#eef1f8">deployment, end to end.</text></g><rect x="556" y="384" width="108" height="6" rx="3" fill="#1b2748"/><rect x="556" y="384" width="108" height="6" rx="3" fill="#247bff"><animate attributeName="width" values="0;108;108" keyTimes="0.0000;0.3333;1.0000" dur="12s" repeatCount="indefinite"/></rect><rect x="676" y="384" width="108" height="6" rx="3" fill="#1b2748"/><rect x="676" y="384" width="0" height="6" rx="3" fill="#247bff"><animate attributeName="width" values="0;0;108;108" keyTimes="0.0000;0.3333;0.6667;1.0000" dur="12s" repeatCount="indefinite"/></rect><rect x="796" y="384" width="108" height="6" rx="3" fill="#1b2748"/><rect x="796" y="384" width="0" height="6" rx="3" fill="#247bff"><animate attributeName="width" values="0;0;108" keyTimes="0.0000;0.6667;1.0000" dur="12s" repeatCount="indefinite"/></rect>
