<style>@keyframes aup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}.au{animation:aup .8s cubic-bezier(.2,.8,.2,1) both}.au{}@keyframes aup2{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.au{animation:aup2 .8s cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
